spring:
  # Reads ../.env (the same file docker compose uses) as properties, so the
  # password is defined in exactly one place. Path is relative to the working
  # directory, which is crm-api/ for both mvn spring-boot:run and the IDE.
  # optional: means a missing file is not an error, so CI can use real env vars.
  config:
    import: optional:file:../.env[.properties]
  application:
    name: northstar-crm
  datasource:
    url: ${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm39}
    username: ${CRM_DB_USERNAME:crm_app}
    # .env names this for the role that owns it, not for the datasource.
    password: ${CRM_APP_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
northstar:
  security:
    jwt-secret: ${JWT_SECRET:lab-only-change-me}
