spring:
  # Both candidate locations are listed because ../ resolves against the JVM
  # working directory, not the source tree: running from crm-api/ needs ../.env,
  # running from lab40-crm/ needs ./.env. Whichever exists is loaded.
  #
  # optional: means a missing file is not an error, so CI can supply real
  # environment variables instead. That silence is safe only because the two
  # secrets below have no defaults -- a missed import crashes the app at
  # startup rather than quietly running it on fallback values.
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: northstar-crm
  datasource:
    url: ${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm40}
    username: ${CRM_DB_USERNAME:crm_app}
    # .env names this for the role that owns it, not for the datasource.
    password: ${CRM_APP_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
northstar:
  security:
    jwt-secret: ${JWT_SECRET}
