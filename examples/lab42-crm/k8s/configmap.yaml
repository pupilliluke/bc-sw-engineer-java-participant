apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-api-config
  labels:
    app: crm-api
    lab: "42"
data:
  # The image only maps CRM_DB_* when profile docker is active. Do not use k8s
  # or kubernetes — application-k8s.yml does not exist in the image.
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_PORT: "8080"
  # host.k3d.internal reaches the host-published 5433 of crm-postgres-lab41.
  # k3d injects that name into CoreDNS when the cluster is created.
  CRM_DB_HOST: "host.k3d.internal"
  CRM_DB_PORT: "5433"
  CRM_DB_NAME: "crm_lab42"
  CRM_DB_USER: "crm"
