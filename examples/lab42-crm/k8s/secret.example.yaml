# DOCUMENTATION ONLY — do not `kubectl apply` this file.
# Applying it creates a Secret whose password is the literal placeholder below.
# Create the real Secret out-of-band (see LAB-42-GUIDE.md Step 2).
apiVersion: v1
kind: Secret
metadata:
  name: crm-api-secrets
  labels:
    app: crm-api
type: Opaque
stringData:
  # Keys only. NEVER commit real passwords, tokens, or kubeconfig.
  CRM_DB_PASSWORD: "REPLACE-OUT-OF-BAND"
  # This build carries Spring Security, which the course baseline image does
  # not. application.yml declares jwt-secret with no default, so the pod will
  # not start without this key.
  JWT_SECRET: "REPLACE-OUT-OF-BAND"
