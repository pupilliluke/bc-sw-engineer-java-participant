# Lab 42 profile. Kubernetes supplies the datasource as separate parts:
# CRM_DB_HOST, CRM_DB_PORT, CRM_DB_NAME and CRM_DB_USER come from the
# crm-api-config ConfigMap, CRM_DB_PASSWORD from the crm-api-secrets Secret.
# The default profile takes a single CRM_DB_URL instead, so the URL is
# assembled here rather than passed whole.
#
# Activated by SPRING_PROFILES_ACTIVE=docker. With no profile active this file
# is not read and application.yml behaves exactly as it did in Lab 41.
#
# None of the four placeholders carries a default, so a ConfigMap or Secret key
# missing at deploy time stops startup rather than falling back to localhost.
spring:
  datasource:
    url: jdbc:postgresql://${CRM_DB_HOST}:${CRM_DB_PORT}/${CRM_DB_NAME}
    username: ${CRM_DB_USER}
    password: ${CRM_DB_PASSWORD}
