services:
  postgres:
    image: postgres:17
    container_name: crm-postgres-lab38
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_admin} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  crm_pgdata:
