# CRM CI — copy this file to java-bootcamp/.github/workflows/crm-ci.yml
# GitHub ignores examples/lab43-crm/.github/  (nested workflows never run)
name: CRM CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

defaults:
  run:
    working-directory: examples/lab43-crm/crm-api

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: crm_lab43
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_lab43"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/crm_lab43
      SPRING_DATASOURCE_USERNAME: crm
      SPRING_DATASOURCE_PASSWORD: change-me
      # secrets via GitHub Actions secrets - never hardcode
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: examples/lab43-crm/crm-api/pom.xml
      - name: Verify
        # Lab 41 has no mvnw — use mvn. Do not -DskipTests on verify.
        run: mvn -B -ntp clean verify
      # TODO(lab43): Optional — keep continue-on-error for training NVD outages
      # - name: Dependency-Check
      #   if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      #   continue-on-error: true
      #   env:
      #     NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      #   run: mvn -B -ntp -Psecurity-scan dependency-check:check -DnvdApiKey=${NVD_API_KEY}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: examples/lab43-crm/crm-api/target/surefire-reports/**

  package:
    needs: verify
    # Package checksum only on main or version tags — not on every PR
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: examples/lab43-crm/crm-api/pom.xml
      - name: Package once
        run: |
          mvn -B -ntp -DskipTests package
          sha256sum target/*.jar > target/SHA256SUMS
          echo "commit=${GITHUB_SHA}" >> target/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: crm-jar
          path: |
            examples/lab43-crm/crm-api/target/*.jar
            examples/lab43-crm/crm-api/target/SHA256SUMS
      # Deploy belongs in Lab 44 — never echo secrets here
